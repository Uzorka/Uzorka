name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No committed lockfile, so use install (not ci).
      - run: npm install --no-audit --no-fund
      - run: npm run build
